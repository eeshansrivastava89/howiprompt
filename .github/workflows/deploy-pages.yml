name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run unit tests
        continue-on-error: true
        run: npm test

      - name: Validate production analytics secrets
        run: |
          if [ "$GITHUB_REPOSITORY" = "eeshansrivastava89/howiprompt" ] && [ "$PUBLIC_ENABLE_ANALYTICS" = "true" ]; then
            if [ -z "$PUBLIC_POSTHOG_KEY" ]; then
              echo "::error::Missing required secret PUBLIC_POSTHOG_KEY for production demo deploy"
              exit 1
            fi
            if [ -z "$PUBLIC_POSTHOG_HOST" ]; then
              echo "::error::Missing required secret PUBLIC_POSTHOG_HOST for production demo deploy"
              exit 1
            fi
          fi
        env:
          PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS || 'true' }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          PUBLIC_ENABLE_ANALYTICS: ${{ vars.PUBLIC_ENABLE_ANALYTICS || 'true' }}
          PUBLIC_ENABLE_LINGUISTICS: ""
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}
          PUBLIC_POSTHOG_UI_HOST: ${{ vars.PUBLIC_POSTHOG_UI_HOST || 'https://us.posthog.com' }}
          PUBLIC_ANALYTICS_ALLOWED_HOSTS: ${{ vars.PUBLIC_ANALYTICS_ALLOWED_HOSTS || (github.repository == 'eeshansrivastava89/howiprompt' && 'howiprompt.eeshans.com' || '') }}

      - name: Copy demo data into build output
        run: |
          cp data/demo/metrics.json frontend/dist/metrics.json
          mkdir -p frontend/dist/wrapped
          cp data/demo/metrics.json frontend/dist/wrapped/metrics.json

      - name: Build static site for Pages
        run: |
          rm -rf dist-static
          mkdir -p dist-static
          cp -r frontend/dist/* dist-static/
          touch dist-static/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-static

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4